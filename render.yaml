# Blueprint de Render para la API (plan gratuito). La base de datos vive en Neon.
services:
  - type: web
    name: restaurant-comida-criolla-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        sync: false # jdbc:postgresql://<host-de-neon>/<base>?sslmode=require
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGENES
        sync: false # https://<tu-proyecto>.vercel.app
      - key: WHATSAPP_DEMO
        value: "true"
      - key: DEMO_REINICIO_CRON
        value: "0 0 4 * * *"
