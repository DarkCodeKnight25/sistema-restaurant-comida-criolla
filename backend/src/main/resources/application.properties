spring.application.name=restaurant-comida-criolla

# Base de datos: PostgreSQL local con docker compose; en producci\u00f3n, las variables de Neon.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5435/restaurant}
spring.datasource.username=${DATABASE_USER:restaurant}
spring.datasource.password=${DATABASE_PASSWORD:restaurant}
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

server.port=${PORT:8083}
server.error.include-message=never
management.endpoints.web.exposure.include=health

app.jwt.secreto=${JWT_SECRET:solo-para-desarrollo-cambiar-en-produccion-32+}
app.cors.origenes=${CORS_ORIGENES:http://localhost:5175,http://127.0.0.1:5175}

# Los acentos se escapan al guardar: Spring lee los .properties en ISO-8859-1.
app.local.nombre=La Saz\u00f3n de Do\u00f1a Meche
app.local.tipo=Comida criolla de barrio
app.local.direccion=Jr. Los Jazmines 000 (direcci\u00f3n de demostraci\u00f3n)
app.local.distrito=Santa Anita, Lima
app.local.horario=Lunes a domingo de 12:00 a 16:00
app.local.celular=900000000
app.local.yape-demo=900 000 000
app.local.demo=${DEMO:true}

app.demo.cargar=${DEMO_CARGAR:true}
# Cron de reinicio diario de la demo; "-" lo desactiva.
app.demo.reinicio-cron=${DEMO_REINICIO_CRON:-}
