# Base de datos local para desarrollo: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: restaurant
      POSTGRES_USER: restaurant
      POSTGRES_PASSWORD: restaurant
      TZ: America/Lima
    ports:
      - "5435:5432"
    volumes:
      - restaurant-datos:/var/lib/postgresql/data

volumes:
  restaurant-datos:
